<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatStateU Key Borrowing Platform | Reset Password</title>
    <link rel="icon" href="../images/weblogo.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css?v=20260211_01">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <img src="../images/weblogo.svg" alt="BatStateU Logo">
                <span>BatStateU</span>
            </a>
            <div class="nav-buttons">
                <label class="theme-toggle">
                    <input type="checkbox" data-theme-toggle aria-label="Toggle dark mode">
                    <span class="toggle-track">
                        <span class="toggle-thumb"></span>
                    </span>
                    <span>Dark Mode</span>
                </label>
                <a href="/" class="nav-btn">Home</a>
            </div>
        </div>
    </nav>

    <!-- Reset Password Section -->
    <div class="login-section">
        <div class="wrapper">
            <div class="side-logo">
                <img src="../images/logo.png" alt="Batangas State University Logo">
            </div>

            <div class="login-container">
                <img src="../images/logo2.png" alt="BatStateU" class="logo">
                <div class="title">Reset Password</div>

                <p class="helper-text">
                    Enter a new password to finish resetting your account. For security reasons, reset links expire after a short time.
                </p>

                <form id="resetPasswordForm" class="active">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter a new password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter your new password" required>
                    </div>

                    <button type="submit" id="resetPasswordSubmitBtn" class="btn">Reset Password</button>
                    <a href="/" class="create-link">Back to Login</a>
                </form>

                <div class="footer-text">
                    © 2025 Batangas State University – The National Engineering University
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notificationContainer" class="toast-container"></div>

    <script src="../js/theme.js?v=20260207_2"></script>
    <script src="../js/maintenance-client.js?v=20260507_01"></script>
    <script src="../js/reset-password.js?v=20260507_01"></script>
</body>
</html>
